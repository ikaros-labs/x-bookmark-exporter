# x2vault in API mode: writes notes and media through Spall.
# Keep secrets in a .env file next to this one (never commit it):
#   X_VAULT_API_URL=http://spall-host:8787
#   X_VAULT_API_TOKEN=vlt_...      # account with [read, create] on "3. Resources/X"
#   X_CLIENT_ID=...                # your X developer app
#   X_CLIENT_SECRET=...            # only for confidential clients
# First start, then log in once (paste the redirected URL when asked):
#   docker compose up -d
#   docker compose exec x2vault python -m x2vault --credentials /data/credentials.json login
services:
  x2vault:
    image: ghcr.io/ikaros-labs/x2vault:latest
    restart: unless-stopped
    environment:
      X_VAULT_API_URL: ${X_VAULT_API_URL}
      X_VAULT_API_TOKEN: ${X_VAULT_API_TOKEN}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      # Defaults baked into the image; override if your vault is laid out differently:
      # X_BOOKMARK_FOLDER: "3. Resources/X/inbox"
      # X_BOOKMARK_ASSETS_FOLDER: "3. Resources/X/assets"
      # X_BOOKMARK_MAX_MEDIA_MB: "10"     # Spall's default body limit is 10 MiB
    volumes:
      - x-bookmarks-data:/data   # credentials.json and state/ (receipts, queue, raw JSON)

volumes:
  x-bookmarks-data:
